<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>Sandmosquito Water Billing - Memuat...</title>
    <script type="text/javascript">
      // SPA redirect script for static hosts (GitHub Pages, etc.)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding-top: 50px; color: #475569;">
      <h2>Memuat halaman Sandmosquito Water Billing...</h2>
      <p>Mohon tunggu sebentar...</p>
    </div>
  </body>
</html>
